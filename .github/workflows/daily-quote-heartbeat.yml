name: Daily Quote & Heartbeat

# Rotates a curated engineering quote and renders its local SVG card once daily.
# The heartbeat log is retained as a lightweight audit trail for the rotation.

on:
  schedule:
    - cron: "5 4 * * *"   # daily at :05, after stats and activity refreshes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-quote-heartbeat
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render quote card and heartbeat
        run: python scripts/render_quote.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/QUOTE.md profile/quote.svg profile/HEARTBEAT.log
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh daily quote card [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "push rejected (concurrent commit), retry $i..."
            git rebase --abort || true
            sleep $((RANDOM % 10 + 5))
          done
          exit 1
