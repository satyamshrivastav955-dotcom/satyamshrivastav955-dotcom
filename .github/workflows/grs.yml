name: Update README Stats Cards

on:
  schedule:
    - cron: "0 3 * * *"   # Daily at 3 AM UTC (8:30 AM IST)
  workflow_dispatch:        # Manual trigger from Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate GitHub Stats Card
        run: |
          curl --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 20 --max-time 60 \
            "https://github-readme-stats.vercel.app/api?username=satyamshrivastav955-dotcom&show_icons=true&count_private=true&include_all_commits=true&bg_color=0b1424&title_color=22d3ee&icon_color=22d3ee&text_color=e2e8f0&hide_border=true&rank_icon=github&show=reviews,prs_merged,prs_merged_percentage" \
            -o profile/stats.svg

      - name: Generate Top Languages Card
        run: |
          curl --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 20 --max-time 60 \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=satyamshrivastav955-dotcom&layout=compact&langs_count=10&bg_color=0b1424&title_color=22d3ee&text_color=e2e8f0&hide_border=true" \
            -o profile/top-langs.svg

      - name: Verify cards are valid SVG (not error pages)
        run: |
          for card in profile/stats.svg profile/top-langs.svg; do
            test -s "$card" || { echo "❌ $card is empty"; exit 1; }
            grep -q "<svg" "$card" || { echo "❌ $card is not SVG"; exit 1; }
            if grep -qi "Something went wrong\|error" "$card"; then
              echo "❌ $card contains an error response" && exit 1
            fi
          done
          echo "✅ Both cards generated successfully"

      - name: Commit and push updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add profile/stats.svg profile/top-langs.svg
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update README stats cards [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "push rejected (concurrent commit), retry $i..."
            git rebase --abort || true
            sleep $((RANDOM % 10 + 5))
          done
          exit 1
