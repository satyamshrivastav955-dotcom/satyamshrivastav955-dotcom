name: Update README Stats Cards

on:
  schedule:
    - cron: "0 3 * * *"   # Daily at 3 AM UTC (8:30 AM IST)
  workflow_dispatch:        # Manual trigger from Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate GitHub Stats Card
        run: |
          curl -s "https://github-readme-stats.vercel.app/api?username=satyamshrivastav955-dotcom&show_icons=true&count_private=true&include_all_commits=true&bg_color=0d1117&title_color=58a6ff&icon_color=58a6ff&text_color=c9d1d9&border_color=30363d&rank_icon=github" -o /tmp/stats.svg

      - name: Generate Top Languages Card
        run: |
          curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=satyamshrivastav955-dotcom&layout=compact&langs_count=8&bg_color=0d1117&title_color=58a6ff&text_color=c9d1d9&border_color=30363d" -o /tmp/top-langs.svg

      - name: Install cards only if they are valid SVG
        run: |
          for f in stats top-langs; do
            if ! head -c 2000 /tmp/$f.svg | grep -q "<svg" || grep -q "Something went wrong" /tmp/$f.svg; then
              echo "$f.svg is not a valid card; keeping the previous version"
              exit 0
            fi
          done
          cp /tmp/stats.svg profile/stats.svg
          cp /tmp/top-langs.svg profile/top-langs.svg

      - name: Commit and push updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update README stats cards [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "push rejected (concurrent commit), retry $i..."
            git rebase --abort || true
            sleep $((RANDOM % 10 + 5))
          done
          exit 1
