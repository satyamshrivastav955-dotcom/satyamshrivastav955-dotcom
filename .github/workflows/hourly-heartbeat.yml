name: Hourly Heartbeat

# Rotates a random dev quote into profile/QUOTE.md every hour and commits it.
# Also appends a timestamped line to profile/HEARTBEAT.log.

on:
  schedule:
    - cron: "5 * * * *"   # every hour at :05 (spread out from other daily jobs)
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: hourly-heartbeat
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Rotate quote + heartbeat file
        run: |
          set -euo pipefail
          mkdir -p profile

          QUOTES=(
            "The system is only as good as the evidence behind its decision."
            "Detect the signal. Explain the risk. Help someone respond."
            "A model that cannot be inspected is a model that cannot be trusted."
            "Latency is a feature — especially when the camera is live."
            "Verify the physical result. Do not trust the plan's description of success."
            "Perception without reasoning is noise. Reasoning without perception is fiction."
            "Build the pipeline, then measure the pipeline, then trust the pipeline."
            "Explainability is not a dashboard. It is a responsibility."
            "Offline-first means the system still works when the network does not."
            "Code is like humor. When you have to explain it, it's bad. — Cory House"
            "First, solve the problem. Then, write the code. — John Johnson"
            "Make it work, make it right, make it fast. — Kent Beck"
            "Talk is cheap. Show me the code. — Linus Torvalds"
            "Premature optimization is the root of all evil. — Donald Knuth"
            "Programs must be written for people to read. — Harold Abelson"
            "The graph stays green when discipline stays daily."
            "Ship small. Ship often. Ship verified."
          )

          IDX=$(( RANDOM % ${#QUOTES[@]} ))
          QUOTE="${QUOTES[$IDX]}"
          NOW_UTC=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          NOW_IST=$(TZ=Asia/Kolkata date +"%Y-%m-%d %H:%M:%S IST")

          cat > profile/QUOTE.md <<EOF
          # 💡 Dev Quote (auto-rotated hourly)

          > $QUOTE

          _Last updated: $NOW_UTC ($NOW_IST)_
          EOF

          # Heartbeat log — appended, capped at last 240 entries (~10 days).
          HEARTBEAT="profile/HEARTBEAT.log"
          touch "$HEARTBEAT"
          echo "$NOW_UTC | $QUOTE" >> "$HEARTBEAT"
          tail -n 240 "$HEARTBEAT" > "$HEARTBEAT.tmp" && mv "$HEARTBEAT.tmp" "$HEARTBEAT"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/QUOTE.md profile/HEARTBEAT.log
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: hourly heartbeat + rotated dev quote [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "push rejected (concurrent commit), retry $i..."
            git rebase --abort || true
            sleep $((RANDOM % 10 + 5))
          done
          exit 1
