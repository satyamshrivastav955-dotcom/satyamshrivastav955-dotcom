<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="100%" height="100%" role="img" aria-label="About Satyam Shrivastav - AI and Security Systems Terminal">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0b1424" />
      <stop offset="100%" stop-color="#060b16" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f1b2e" />
      <stop offset="100%" stop-color="#0b1424" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, Monaco, monospace; }
    .title-bar { font-size: 12px; fill: #64748b; letter-spacing: 0.5px; }
    .cmd-prompt { font-size: 13.5px; font-weight: 700; fill: #4ade80; }
    .cmd-text { font-size: 13.5px; font-weight: 600; fill: #f1f5f9; }
    .out-name { font-size: 15px; font-weight: 700; fill: #38bdf8; letter-spacing: -0.2px; }
    .out-sub { font-size: 13px; fill: #94a3b8; }
    .out-quote { font-size: 13px; font-style: italic; fill: #fbbf24; }
    .chip-bg { fill: #0b172a; stroke: #1e3352; stroke-width: 1; }
    .chip-gold { fill: #1c1910; stroke: #854d0e; stroke-width: 1; }
    .chip-cyan { fill: #08212e; stroke: #0e7490; stroke-width: 1; }
    .chip-green { fill: #062217; stroke: #15803d; stroke-width: 1; }
    .chip-label { font-size: 11px; font-weight: 600; }
    .status-text { font-size: 11px; fill: #34d399; font-weight: 600; letter-spacing: 0.8px; }
    .dim-label { font-size: 11px; fill: #475569; }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    .pulse {
      animation: pulseDot 2s ease-in-out infinite;
      transform-origin: center;
    }
    @keyframes scan {
      0% { transform: translateX(-200px); }
      100% { transform: translateX(920px); }
    }
    .scanner {
      animation: scan 4s linear infinite;
    }
  </style>

  <!-- Terminal Window Base -->
  <rect x="2" y="2" width="916" height="406" rx="14" fill="url(#termBg)" stroke="#1e3a5f" stroke-width="1.4" />
  
  <!-- Subtle Background Grid -->
  <g stroke="#13233a" stroke-width="0.8" opacity="0.35">
    <path d="M0 44 H920 M0 100 H920 M0 160 H920 M0 220 H920 M0 280 H920 M0 340 H920" />
    <path d="M120 44 V410 M260 44 V410 M400 44 V410 M540 44 V410 M680 44 V410 M820 44 V410" />
  </g>

  <!-- Header Bar -->
  <path d="M2 16 Q2 2 16 2 L904 2 Q918 2 918 16 L918 42 L2 42 Z" fill="url(#headerGrad)" />
  <line x1="2" y1="42" x2="918" y2="42" stroke="url(#cyanLine)" stroke-width="1.5" />

  <!-- Animated Scanner Beam on Header -->
  <g opacity="0.6">
    <rect x="0" y="41" width="160" height="2" fill="url(#scanBeam)" class="scanner" />
  </g>

  <!-- Window Controls -->
  <circle cx="24" cy="22" r="6" fill="#f87171" />
  <circle cx="44" cy="22" r="6" fill="#fbbf24" />
  <circle cx="64" cy="22" r="6" fill="#4ade80" />

  <!-- Window Title -->
  <text x="460" y="26" text-anchor="middle" class="font-mono title-bar">satyam@systems-lab: ~/identity-matrix (zsh)</text>

  <!-- Top Right Live Status Beacon -->
  <g transform="translate(740, 14)">
    <rect width="160" height="20" rx="10" fill="#051c14" stroke="#166534" stroke-width="1" />
    <circle cx="12" cy="10" r="3.5" fill="#22c55e" filter="url(#badgeGlow)" class="pulse" />
    <text x="24" y="14" class="font-mono status-text">ONLINE · READY</text>
  </g>

  <!-- Terminal Content -->
  <g transform="translate(26, 68)">
    
    <!-- Command 1: whoami -->
    <text x="0" y="0" class="font-mono cmd-prompt">$</text>
    <text x="18" y="0" class="font-mono cmd-text">whoami --verbose</text>
    <text x="18" y="24" class="font-sans out-name">Satyam Santosh Shrivastav <tspan font-weight="400" fill="#64748b">|</tspan> <tspan font-weight="600" fill="#7dd3fc">AI &amp; Security Systems Architect</tspan></text>
    <text x="18" y="44" class="font-sans out-sub">Edge AI · Multimodal VLMs · Runtime Cybersecurity · Embodied Robotics</text>

    <!-- Command 2: cat mission.txt -->
    <g transform="translate(0, 76)">
      <text x="0" y="0" class="font-mono cmd-prompt">$</text>
      <text x="18" y="0" class="font-mono cmd-text">cat core_philosophy.txt</text>
      <text x="18" y="22" class="font-mono out-quote">"Verify the outcome before trusting the model. Measure latency, quantize inference, enforce proof."</text>
    </g>

    <!-- Verified Accolades HUD Matrix (3 Chips) -->
    <g transform="translate(0, 126)">
      <!-- Chip 1: Hackathon Champion -->
      <g transform="translate(18, 0)">
        <rect width="270" height="42" rx="8" class="chip-gold" />
        <text x="14" y="19" class="font-sans" font-size="14">🏆</text>
        <text x="36" y="18" class="font-sans chip-label" fill="#fde047">2x National 1st Prize Winner</text>
        <text x="36" y="32" class="font-sans" font-size="10.5" fill="#a1a1aa">CIH '26 (₹25k) · Ikigai '26 · ISRO Hack</text>
      </g>

      <!-- Chip 2: Published Researcher -->
      <g transform="translate(300, 0)">
        <rect width="270" height="42" rx="8" class="chip-cyan" />
        <text x="14" y="19" class="font-sans" font-size="14">📄</text>
        <text x="36" y="18" class="font-sans chip-label" fill="#38bdf8">4x Peer-Reviewed Publications</text>
        <text x="36" y="32" class="font-sans" font-size="10.5" fill="#a1a1aa">1 Int'l Journal (NASA) + 3 Conferences</text>
      </g>

      <!-- Chip 3: Applied Experience -->
      <g transform="translate(582, 0)">
        <rect width="270" height="42" rx="8" class="chip-green" />
        <text x="14" y="19" class="font-sans" font-size="14">💼</text>
        <text x="36" y="18" class="font-sans chip-label" fill="#4ade80">ML Engineer &amp; Cloud Consultant</text>
        <text x="36" y="32" class="font-sans" font-size="10.5" fill="#a1a1aa">Softron · SkillOrbit · AWS Certified</text>
      </g>
    </g>

    <!-- Command 3: ls ~/active_focus -->
    <g transform="translate(0, 202)">
      <text x="0" y="0" class="font-mono cmd-prompt">$</text>
      <text x="18" y="0" class="font-mono cmd-text">ls -la active_focus/</text>
      <g transform="translate(18, 12)">
        <text x="0" y="14" class="font-mono" font-size="12.5" fill="#22d3ee">drwx  argus_offline_vlm/        <tspan fill="#64748b">→ edge perception, byte-track, qwen2.5-vl</tspan></text>
        <text x="0" y="32" class="font-mono" font-size="12.5" fill="#2dd4bf">drwx  callshield_voice_sec/     <tspan fill="#64748b">→ deepfake audio, speaker verif, langgraph</tspan></text>
        <text x="0" y="50" class="font-mono" font-size="12.5" fill="#a855f7">drwx  graphql_threat_sentinel/  <tspan fill="#64748b">→ nested query defense, runtime policy engine</tspan></text>
        <text x="0" y="68" class="font-mono" font-size="12.5" fill="#fbbf24">drwx  nexus1_robot_control/     <tspan fill="#64748b">→ closed-loop mujoco, damped least-squares ik</tspan></text>
      </g>
    </g>

    <!-- Blinking Prompt -->
    <g transform="translate(0, 304)">
      <text x="0" y="0" class="font-mono cmd-prompt">$</text>
      <text x="18" y="0" class="font-mono" font-size="13" fill="#94a3b8">git status</text>
      <text x="110" y="0" class="font-mono" font-size="13" fill="#22d3ee">--branch main (clean)</text>
      <rect x="290" y="-12" width="8" height="15" fill="#4ade80">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />
      </rect>
    </g>

  </g>

  <!-- Bottom Terminal Status Strip -->
  <line x1="2" y1="384" x2="918" y2="384" stroke="#14243b" stroke-width="1" />
  <text x="24" y="399" class="font-mono dim-label">BUILD: <tspan fill="#38bdf8">ARGUS v0.9 (offline-first)</tspan></text>
  <text x="460" y="399" text-anchor="middle" class="font-mono dim-label">TZ: <tspan fill="#94a3b8">Asia/Kolkata (IST +5:30)</tspan> · STATUS: <tspan fill="#4ade80">OPEN TO COLLABORATE</tspan></text>
  <text x="896" y="399" text-anchor="end" class="font-mono dim-label">KEY: <tspan fill="#64748b">SHA-256 VERIFIED</tspan></text>
</svg>
