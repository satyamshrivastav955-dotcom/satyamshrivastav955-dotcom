<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#152238"/></linearGradient></defs><rect x=".5" y=".5" width="999" height="339" rx="16" fill="url(#g)" stroke="#30363d"/><text x="40" y="54" font-size="11.5" fill="#58a6ff" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" letter-spacing="2" >FLAGSHIP BUILD  ·  IN ACTIVE DEVELOPMENT</text><text x="40" y="104" font-size="46" fill="#e6edf3" font-weight="700" text-anchor="start" letter-spacing="-1">ARGUS</text><text x="40" y="134" font-size="17" fill="#8b949e" font-weight="400" text-anchor="start" >Offline AI video intelligence</text><text x="40" y="168" font-size="14" fill="#8b949e" font-weight="400" text-anchor="start" >See the scene. Understand the event. Deliver the alert. ARGUS turns camera feeds into structured</text><text x="40" y="190" font-size="14" fill="#8b949e" font-weight="400" text-anchor="start" >observations and event-driven alerts, running entirely on constrained local hardware instead of the</text><text x="40" y="212" font-size="14" fill="#8b949e" font-weight="400" text-anchor="start" >cloud.</text><rect x="40" y="236" width="200" height="64" rx="10" fill="#0d1117" stroke="#30363d"/><rect x="40" y="236" width="200" height="3" rx="1.5" fill="#58a6ff"/><text x="56" y="264" font-size="11" fill="#58a6ff" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" letter-spacing="1.5" >CAMERA FEED</text><text x="56" y="284" font-size="12.5" fill="#8b949e" font-weight="400" text-anchor="start" >RTSP · USB · file</text><line x1="248" y1="268" x2="272" y2="268" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" from="1