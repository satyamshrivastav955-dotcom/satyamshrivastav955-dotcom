<svg xmlns="http://www.w3.org/2000/svg" width="490" height="238" viewBox="0 0 490 238" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif"><defs></defs><rect x=".5" y=".5" width="489" height="237" rx="12" fill="#161b22" stroke="#30363d"/><rect x="1" y="24" width="3" height="22" rx="1.5" fill="#3fb950"/><circle cx="26" cy="35" r="4" fill="#3fb950"/><text x="38" y="39" font-size="11" fill="#3fb950" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" letter-spacing="1.5" >DEV TOOLING  ·  TRUST</text><text x="466" y="39" font-size="16" fill="#6e7681" font-weight="400" text-anchor="end" >↗</text><text x="24" y="76" font-size="21" fill="#e6edf3" font-weight="700" text-anchor="start" letter-spacing="-0.3">ReproCheck</text><text x="24" y="104" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start" >Passing tests don't prove reproducibility. Runs verification twice</text><text x="24" y="124" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start" >in isolated workspaces and compares artifacts to catch drift.</text><line x1="24" y1="156" x2="466" y2="156" stroke="#30363d"/><text x="24" y="180" font-size="12.5" fill="#3fb950" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" >2 passing runs → drift_detected</text><rect x="24" y="198" width="57.599999999999994" height="22" rx="11" fill="#0d1117" stroke="#30363d"/><text x="52.8" y="213" font-size="11" fill="#8b949e" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" >Python</text><rect x="89.6" y="198" width="57.599999999999994" height="22" rx="11" fill="#0d1117" stroke="#30363d"/><text x="118.39999999999999" y="213" font-size="11" fill="#8b949e" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" >Docker</text><rect x="155.2" y="198" width="31.2" hei