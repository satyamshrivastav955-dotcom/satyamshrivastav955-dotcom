<svg xmlns="http://www.w3.org/2000/svg" width="490" height="238" viewBox="0 0 490 238" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif"><defs></defs><rect x=".5" y=".5" width="489" height="237" rx="12" fill="#161b22" stroke="#30363d"/><rect x="1" y="24" width="3" height="22" rx="1.5" fill="#d29922"/><circle cx="26" cy="35" r="4" fill="#d29922"/><text x="38" y="39" font-size="11" fill="#d29922" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" letter-spacing="1.5" >ROBOTICS  ·  AGENTS</text><text x="466" y="39" font-size="16" fill="#6e7681" font-weight="400" text-anchor="end" >↗</text><text x="24" y="76" font-size="21" fill="#e6edf3" font-weight="700" text-anchor="start" letter-spacing="-0.3">Language-to-Action Robot Agent</text><text x="24" y="104" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start" >A local LLM plans a 6-DOF arm task in MuJoCo, then a ground-truth</text><text x="24" y="124" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start" >verifier checks the real outcome and retries from measured error.</text><line x1="24" y1="156" x2="466" y2="156" stroke="#30363d"/><text x="24" y="180" font-size="12.5" fill="#d29922" font-weight="600" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" >Plan → execute → verify → retry</text><rect x="24" y="198" width="57.599999999999994" height="22" rx="11" fill="#0d1117" stroke="#30363d"/><text x="52.8" y="213" font-size="11" fill="#8b949e" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" >MuJoCo</text><rect x="89.6" y="198" width="77.4" height="22" rx="11" fill="#0d1117" stroke="#30363d"/><text x="128.3" y="213" font-size="11" fill="#8b949e" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" >Local LLM</text><rect x="175.0" y="198" width="84.0" height="22" rx="11" fill="#0d1117" stroke="#30363d"/><text x="217.0" y="213" font-size="11" fill="#8b949e" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" >IK control</text></svg>