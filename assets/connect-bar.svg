<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 52" width="100%" height="52">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; fill: #475569; }
    .link-text { font-size: 12px; font-weight: 600; fill: #94a3b8; }
    .link-text-hl { font-size: 12px; font-weight: 600; fill: #38bdf8; }
  </style>
  <rect width="920" height="52" fill="#030712"/>
  <line x1="0" y1="0" x2="920" y2="0" stroke="#0f1d2e" stroke-width="1"/>
  <line x1="0" y1="51" x2="920" y2="51" stroke="#0f1d2e" stroke-width="1"/>

  <!-- Left: Connect -->
  <text x="16" y="19" class="font-mono label">CONNECT</text>

  <!-- GitHub -->
  <g transform="translate(88, 8)">
