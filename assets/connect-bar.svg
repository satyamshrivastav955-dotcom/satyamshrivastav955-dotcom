    <text x="22" y="12" class="font-sans link-text-hl">satyamshrivastav955-dotcom</text>
  </g>

  <!-- Separator -->
  <text x="290" y="28" class="font-sans" fill="#1e3a5f" font-size="18">·</text>

  <!-- LinkedIn -->
  <g transform="translate(302, 8)">
    <rect width="16" height="16" rx="3" fill="#0077b5"/>
    <text x="5" y="12" font-size="10" font-weight="700" fill="white" font-family="Arial">in</text>
    <text x="22" y="12" class="font-sans link-text">Satyam Shrivastav</text>
  </g>

  <!-- Separator -->
  <text x="450" y="28" class="font-sans" fill="#1e3a5f" font-size="18">·</text>

  <!-- Email -->
  <g transform="translate(462, 10)">
    <path d="M1 2.5A1.5 1.5 0 012.5 1h11A1.5 1.5 0 0115 2.5v9A1.5 1.5 0 0113.5 13h-11A1.5 1.5 0 011 11.5v-9zm.5 0v.217l6 4.2 6-4.2V2.5a1 1 0 00-1-1h-10a1 1 0 00-1 1zM13 4.383L8 7.82 3 4.383V11.5a1 1 0 001 1h8a1 1 0 001-1V4.383z" fill="#94a3b8"/>
    <text x="20" y="12" class="font-sans link-text">satyamshrivastav955@gmail.com</text>
  </g>

