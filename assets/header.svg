<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 28px; font-weight: 700; fill: #f8fafc; letter-spacing: -0.5px; }
    .greeting { font-size: 14px; font-weight: 400; fill: #8b9cb5; }
    .subtitle { font-size: 10px; font-weight: 600; fill: #7e8ea6; letter-spacing: 1.5px; }
    .pill-bg { fill: #0b1424; stroke: #1a2c47; stroke-width: 1; rx: 13; }
    .pill-text { font-size: 11.5px; font-weight: 500; fill: #94a3b8; }
    .status-text { font-size: 11px; font-weight: 500; fill: #8b9cb5; letter-spacing: 0.5px; }
    .side-text { font-size: 9.5px; font-weight: 600; fill: #5a6e8c; letter-spacing: 1.4px; line-height: 1.4; }
  </style>

  <!-- Background Canvas -->
  <rect width="920" height="180" fill="#030712" />

  <!-- Top Right Status (Right-Aligned) -->
  <g transform="translate(896, 24)">
    <circle cx="-190" cy="0" r="3.5" fill="#22c55e" filter="url(#glow)" />
    <text x="0" y="3.5" text-anchor="end" class="font-sans status-text">Building · Learning · Improving</text>
  </g>

  <!-- Greeting -->
  <text x="16" y="34" class="font-sans greeting">Hi, I'm</text>

  <!-- Name + Cursor -->
  <text x="16" y="74" class="font-sans title">Satyam Santosh Shrivastav</text>
  <rect x="424" y="52" width="3" height="24" fill="#38bdf8" rx="1" filter="url(#glow)" />

  <!-- Subtitle -->
  <text x="16" y="104" class="font-mono subtitle">BUILDING EDGE AI SYSTEMS FOR VOICE SECURITY, FRAUD DEFENSE &amp; INTELLIGENT AUTOMATION.</text>

  <!-- Pill Tags -->
  <g transform="translate(16, 126)">
    <!-- AI -->
    <g transform="translate(0, 0)">
      <rect width="42" height="26" class="pill-bg" />
      <text x="21" y="17" text-anchor="middle" class="font-sans pill-text">AI</text>
    </g>
    <!-- Edge AI -->
    <g transform="translate(50, 0)">
      <rect width="68" height="26" class="pill-bg" />
      <text x="34" y="17" text-anchor="middle" class="font-sans pill-text">Edge AI</text>
    </g>
    <!-- Security -->
    <g transform="translate(126, 0)">
      <rect width="70" height="26" class="pill-bg" />
      <text x="35" y="17" text-anchor="middle" class="font-sans pill-text">Security</text>
    </g>
    <!-- Android -->
    <g transform="translate(204, 0)">
      <rect width="66" height="26" class="pill-bg" />
      <text x="33" y="17" text-anchor="middle" class="font-sans pill-text">Android</text>
    </g>
    <!-- Real-world Impact -->
    <g transform="translate(278, 0)">
      <rect width="132" height="26" class="pill-bg" />
      <text x="66" y="17" text-anchor="middle" class="font-sans pill-text">Real-world Impact</text>
    </g>
  </g>

  <!-- Right Side Equalizer / Waveform & Slogan -->
  <g transform="translate(680, 118)">
    <!-- Audio Waveform Bars -->
    <g transform="translate(0, 20)">
      <rect x="0"  y="-6"  width="2.5" height="12" rx="1.2" fill="url(#waveGrad)" />
      <rect x="5"  y="-12" width="2.5" height="24" rx="1.2" fill="url(#waveGrad)" />
      <rect x="10" y="-8"  width="2.5" height="16" rx="1.2" fill="url(#waveGrad)" />
      <rect x="15" y="-18" width="2.5" height="36" rx="1.2" fill="url(#waveGrad)" />
      <rect x="20" y="-14" width="2.5" height="28" rx="1.2" fill="url(#waveGrad)" />
      <rect x="25" y="-22" width="2.5" height="44" rx="1.2" fill="url(#waveGrad)" />
      <rect x="30" y="-10" width="2.5" height="20" rx="1.2" fill="url(#waveGrad)" />
      <rect x="35" y="-24" width="2.5" height="48" rx="1.2" fill="url(#waveGrad)" />
      <rect x="40" y="-16" width="2.5" height="32" rx="1.2" fill="url(#waveGrad)" />
      <rect x="45" y="-8"  width="2.5" height="16" rx="1.2" fill="url(#waveGrad)" />
      <rect x="50" y="-19" width="2.5" height="38" rx="1.2" fill="url(#waveGrad)" />
      <rect x="55" y="-12" width="2.5" height="24" rx="1.2" fill="url(#waveGrad)" />
      <rect x="60" y="-5"  width="2.5" height="10" rx="1.2" fill="url(#waveGrad)" />
    </g>

    <!-- Side Text -->
    <g transform="translate(85, 10)">
      <text x="0" y="0" class="font-mono side-text">REAL IDEAS</text>
      <text x="0" y="13" class="font-mono side-text">REAL SYSTEMS</text>
      <text x="0" y="26" class="font-mono side-text">SAFER CONVERSATIONS</text>
    </g>
  </g>
</svg>
