<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" role="img" aria-labelledby="title desc">
  <title id="title">Satyam Santosh Shrivastav — AI and security systems builder</title>
  <desc id="desc">A dark systems-lab header with animated signal lines and the message: building practical intelligence for safer, smarter systems.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712" />
      <stop offset="0.58" stop-color="#071426" />
      <stop offset="1" stop-color="#100b22" />
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="0.52" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.24" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 2px; fill: #67e8f9; }
      .name { font-size: 29px; font-weight: 750; letter-spacing: -0.8px; fill: #f8fafc; }
      .statement { font-size: 12px; font-weight: 500; letter-spacing: 1.7px; fill: #94a3b8; }
      .copy { font-size: 12px; fill: #8b9cb5; }
      .status { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; fill: #86efac; }
      .motion { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .drift { animation: drift 7s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes drift { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(12px); } }
      @media (prefers-reduced-motion: reduce) { .motion, .drift { animation: none; } }
    </style>
  </defs>

  <rect width="920" height="230" rx="12" fill="url(#bg)" />

  <!-- Quiet technical grid -->
  <g stroke="#17304b" stroke-width="1" opacity="0.42">
    <path d="M0 46H920M0 92H920M0 138H920M0 184H920" />
    <path d="M46 0V230M92 0V230M138 0V230M184 0V230M230 0V230M276 0V230M322 0V230M368 0V230M414 0V230M460 0V230M506 0V230M552 0V230M598 0V230M644 0V230M690 0V230M736 0V230M782 0V230M828 0V230M874 0V230" />
  </g>

  <!-- Header copy -->
  <g transform="translate(32 30)">
    <text class="mono eyebrow" x="0" y="0">SYSTEMS LAB // 01</text>
    <text class="sans name" x="0" y="48">Satyam Santosh Shrivastav</text>
    <rect x="426" y="24" width="3" height="28" rx="1.5" fill="#67e8f9" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite" />
    </rect>
    <text class="mono statement" x="0" y="79">AI  ×  SECURITY  ×  AUTOMATION</text>
    <text class="sans copy" x="0" y="112">Building practical intelligence for safer, smarter systems.</text>
    <g transform="translate(0 135)">
      <rect width="174" height="27" rx="13.5" fill="#062219" stroke="#166534" />
      <circle class="motion" cx="16" cy="13.5" r="3.5" fill="#4ade80" filter="url(#softGlow)" />
      <text class="mono status" x="29" y="17">OPEN TO COLLABORATE</text>
    </g>
  </g>

  <!-- Signal visual -->
  <g transform="translate(695 112)">
    <circle cx="0" cy="0" r="108" fill="url(#glow)" />
    <circle cx="0" cy="0" r="76" fill="none" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3 8" />
    <circle cx="0" cy="0" r="51" fill="none" stroke="url(#signal)" stroke-width="1.5" opacity="0.75" />
    <circle class="motion" cx="0" cy="0" r="8" fill="#22d3ee" filter="url(#softGlow)" />
    <g class="drift" fill="url(#signal)">
      <rect x="-82" y="-2" width="3" height="4" rx="1.5" />
      <rect x="-73" y="-10" width="3" height="20" rx="1.5" />
      <rect x="-64" y="-18" width="3" height="36" rx="1.5" />
      <rect x="-55" y="-7" width="3" height="14" rx="1.5" />
      <rect x="-46" y="-27" width="3" height="54" rx="1.5" />
      <rect x="-37" y="-14" width="3" height="28" rx="1.5" />
      <rect x="-28" y="-36" width="3" height="72" rx="1.5" />
      <rect x="-19" y="-20" width="3" height="40" rx="1.5" />
      <rect x="-10" y="-12" width="3" height="24" rx="1.5" />
      <rect x="-1" y="-31" width="3" height="62" rx="1.5" />
      <rect x="8" y="-17" width="3" height="34" rx="1.5" />
      <rect x="17" y="-25" width="3" height="50" rx="1.5" />
      <rect x="26" y="-9" width="3" height="18" rx="1.5" />
      <rect x="35" y="-20" width="3" height="40" rx="1.5" />
      <rect x="44" y="-12" width="3" height="24" rx="1.5" />
      <rect x="53" y="-31" width="3" height="62" rx="1.5" />
      <rect x="62" y="-15" width="3" height="30" rx="1.5" />
      <rect x="71" y="-5" width="3" height="10" rx="1.5" />
      <rect x="80" y="-19" width="3" height="38" rx="1.5" />
    </g>
    <g class="mono" transform="translate(-88 96)">
      <text x="0" y="0" font-size="9" letter-spacing="1.6" fill="#5a6e8c">SIGNAL IN</text>
      <text x="98" y="0" font-size="9" letter-spacing="1.6" fill="#5a6e8c">SYSTEM OUT</text>
    </g>
  </g>

  <path d="M32 207H888" stroke="#1b3553" />
  <path d="M32 207H242" stroke="url(#signal)" stroke-width="2" />
</svg>
