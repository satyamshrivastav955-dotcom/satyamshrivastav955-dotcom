<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="100%" height="100%" role="img" aria-label="Peer-Reviewed Research Publications - Satyam Shrivastav">
  <defs>
    <linearGradient id="pubBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b16" />
      <stop offset="45%" stop-color="#091322" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>
    <linearGradient id="cyanTealBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cardPub1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081829" />
      <stop offset="100%" stop-color="#09121f" />
    </linearGradient>
    <linearGradient id="cardPub2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091a24" />
      <stop offset="100%" stop-color="#08141e" />
    </linearGradient>
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="pulseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, Monaco, monospace; }
    .header-tag { font-size: 11px; font-weight: 700; fill: #22d3ee; letter-spacing: 2px; }
    .header-title { font-size: 21px; font-weight: 750; fill: #f8fafc; letter-spacing: -0.3px; }
    .header-sub { font-size: 12.5px; fill: #94a3b8; }
    .card-title { font-size: 14px; font-weight: 700; fill: #f1f5f9; letter-spacing: -0.2px; }
    .card-venue { font-size: 11px; fill: #7dd3fc; font-weight: 600; }
    .card-meta { font-size: 11px; fill: #8b9cb5; }
    .card-date { font-size: 10.5px; fill: #64748b; font-weight: 500; }
    .journal-badge-text { font-size: 10px; font-weight: 750; fill: #38bdf8; letter-spacing: 0.5px; }
    .conf-badge-text { font-size: 10px; font-weight: 700; fill: #2dd4bf; letter-spacing: 0.5px; }
    .conf2-badge-text { font-size: 10px; font-weight: 700; fill: #34d399; letter-spacing: 0.5px; }
    .conf3-badge-text { font-size: 10px; font-weight: 700; fill: #c084fc; letter-spacing: 0.5px; }

    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.75; }
    }
    .pulse-node {
      animation: pulseNode 2.8s ease-in-out infinite;
      transform-origin: 32px 36px;
    }
    @keyframes beamFlowPub {
      0% { transform: translateX(-240px); }
      100% { transform: translateX(960px); }
    }
    .beam-pub {
      animation: beamFlowPub 4.8s linear infinite;
    }
  </style>

  <!-- Container Base -->
  <rect x="2" y="2" width="916" height="306" rx="14" fill="url(#pubBg)" stroke="#1a2d47" stroke-width="1.3" />

  <!-- Subtle Technical Grid Lines -->
  <g stroke="#101d30" stroke-width="0.8" opacity="0.35">
    <path d="M0 64 H920 M0 182 H920" />
    <path d="M460 64 V310" />
  </g>

  <!-- Animated Top Beam -->
  <g opacity="0.75">
    <rect x="0" y="2" width="220" height="2" fill="url(#cyanTealBeam)" class="beam-pub" />
  </g>

  <!-- Header Section -->
  <g transform="translate(24, 20)">
    <!-- Animated Research Orb Icon -->
    <g class="pulse-node">
      <circle cx="20" cy="18" r="18" fill="#0c1f30" stroke="#0e7490" stroke-width="1.2" />
      <text x="20" y="24" text-anchor="middle" font-size="18" filter="url(#nodeGlow)">📚</text>
    </g>

    <g transform="translate(52, 6)">
      <text x="0" y="0" class="font-mono header-tag">PEER-REVIEWED RESEARCH</text>
      <text x="0" y="22" class="font-sans header-title">Scientific Publications &amp; International Proceedings</text>
      <text x="0" y="38" class="font-sans header-sub">1 International Journal · 3 International Conferences · Verified Peer-Reviewed Contributions</text>
    </g>

    <!-- Header Right Live Badge -->
    <g transform="translate(710, 8)">
      <rect width="162" height="26" rx="13" fill="#08221b" stroke="#166534" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#34d399" filter="url(#pulseGlow)" />
      <text x="26" y="17" class="font-mono" font-size="10" font-weight="700" fill="#4ade80">INDEXED &amp; VERIFIED</text>
    </g>
  </g>

  <!-- Divider Line with Animated Pulse Dot -->
  <line x1="24" y1="74" x2="896" y2="74" stroke="#16263d" stroke-width="1" />
  <circle cy="74" r="2.5" fill="#38bdf8" filter="url(#pulseGlow)">
    <animate attributeName="cx" from="24" to="896" dur="4.2s" repeatCount="indefinite" />
  </circle>

  <!-- ================= 4 PUBLICATION CARDS GRID ================= -->

  <!-- CARD 1: NASA Missions Dashboard (Journal) -->
  <g transform="translate(24, 88)">
    <rect width="426" height="96" rx="10" fill="url(#cardPub1)" stroke="#0284c7" stroke-width="1.2" />
    
    <!-- Accent Left Cyan Bar -->
    <rect x="0" y="0" width="5" height="96" rx="2" fill="#38bdf8" />

    <g transform="translate(18, 14)">
      <text x="0" y="10" font-size="15">🪐</text>
      <text x="22" y="10" class="font-sans card-title">NASA Missions Dashboard: Space Analytics</text>
      
      <!-- Badges -->
      <g transform="translate(0, 20)">
        <rect width="148" height="19" rx="9.5" fill="#0c2338" stroke="#0284c7" stroke-width="1" />
        <text x="74" y="13.5" text-anchor="middle" class="font-mono journal-badge-text">INTERNATIONAL JOURNAL</text>
      </g>
      <g transform="translate(156, 20)">
        <rect width="76" height="19" rx="9.5" fill="#062217" stroke="#15803d" stroke-width="0.8" />
        <text x="38" y="13.5" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#4ade80">VERIFIED</text>
      </g>

      <text x="0" y="55" class="font-sans card-venue">Journal of Computer Science Eng &amp; Software Testing</text>
      <text x="0" y="69" class="font-mono card-date">10 Feb 2026 · Real-Time NASA APIs · Streamlit · Space Telemetry</text>
    </g>
  </g>

  <!-- CARD 2: GraphQL Anomaly Detection (Conference - backs GraphQL-Sentinel) -->
  <g transform="translate(470, 88)">
    <rect width="426" height="96" rx="10" fill="url(#cardPub2)" stroke="#0d9488" stroke-width="1.2" />
    
    <!-- Accent Left Teal Bar -->
    <rect x="0" y="0" width="5" height="96" rx="2" fill="#2dd4bf" />

    <g transform="translate(18, 14)">
      <text x="0" y="10" font-size="15">🛡️</text>
      <text x="22" y="10" class="font-sans card-title">Hybrid AI Anomaly Detection in GraphQL APIs</text>
      
      <!-- Badges -->
      <g transform="translate(0, 20)">
        <rect width="144" height="19" rx="9.5" fill="#082b26" stroke="#0d9488" stroke-width="1" />
        <text x="72" y="13.5" text-anchor="middle" class="font-mono conf-badge-text">ICNGCIS25 CONFERENCE</text>
      </g>
      <g transform="translate(152, 20)">
        <rect width="138" height="19" rx="9.5" fill="#181330" stroke="#7c3aed" stroke-width="0.8" />
        <text x="69" y="13.5" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="700" fill="#c084fc">GRAPHQL-SENTINEL</text>
      </g>

      <text x="0" y="55" class="font-sans card-venue">3rd Int'l Conf. on Next Generation Computing &amp; Info Systems</text>
      <text x="0" y="69" class="font-mono card-date">7 Dec 2025 · Nested-Query Attacks · Hybrid AI Framework</text>
    </g>
  </g>

  <!-- CARD 3: MediSmart (Conference) -->
  <g transform="translate(24, 196)">
    <rect width="426" height="96" rx="10" fill="url(#cardPub2)" stroke="#15803d" stroke-width="1" />
    
    <!-- Accent Left Emerald Bar -->
    <rect x="0" y="0" width="5" height="96" rx="2" fill="#34d399" />

    <g transform="translate(18, 14)">
      <text x="0" y="10" font-size="15">🏥</text>
      <text x="22" y="10" class="font-sans card-title">MediSmart: Intelligent Symptom &amp; Medication</text>
      
      <!-- Badges -->
      <g transform="translate(0, 20)">
        <rect width="168" height="19" rx="9.5" fill="#072b1d" stroke="#10b981" stroke-width="1" />
        <text x="84" y="13.5" text-anchor="middle" class="font-mono conf2-badge-text">ICETMIS25 CONFERENCE</text>
      </g>
      <g transform="translate(176, 20)">
        <rect width="76" height="19" rx="9.5" fill="#062217" stroke="#15803d" stroke-width="0.8" />
        <text x="38" y="13.5" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#4ade80">VERIFIED</text>
      </g>

      <text x="0" y="55" class="font-sans card-venue">Int'l Conf. on Emerging Tech for Multidisciplinary Innovation</text>
      <text x="0" y="69" class="font-mono card-date">4 Dec 2025 · Intelligent Decision Support · Mobile &amp; Web Platform</text>
    </g>
  </g>

  <!-- CARD 4: Personal Finance Tracker using Llama Vision (Conference) -->
  <g transform="translate(470, 196)">
    <rect width="426" height="96" rx="10" fill="url(#cardPub1)" stroke="#7c3aed" stroke-width="1" />
    
    <!-- Accent Left Purple Bar -->
    <rect x="0" y="0" width="5" height="96" rx="2" fill="#c084fc" />

    <g transform="translate(18, 14)">
      <text x="0" y="10" font-size="15">👁️</text>
      <text x="22" y="10" class="font-sans card-title">Personal Finance Tracker via OCR &amp; Llama Vision</text>
      
      <!-- Badges -->
      <g transform="translate(0, 20)">
        <rect width="154" height="19" rx="9.5" fill="#20133b" stroke="#8b5cf6" stroke-width="1" />
        <text x="77" y="13.5" text-anchor="middle" class="font-mono conf3-badge-text">ICAST-2024 CONFERENCE</text>
      </g>
      <g transform="translate(162, 20)">
        <rect width="112" height="19" rx="9.5" fill="#0c1d2e" stroke="#0e7490" stroke-width="0.8" />
        <text x="56" y="13.5" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="700" fill="#38bdf8">LLAMA VISION</text>
      </g>

      <text x="0" y="55" class="font-sans card-venue">7th Int'l Conf. on Advances in Science and Technology</text>
      <text x="0" y="69" class="font-mono card-date">20 Jun 2025 · Multimodal VLM · Optical Character Recognition</text>
    </g>
  </g>

</svg>
