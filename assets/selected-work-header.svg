<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 36" width="100%" height="100%">
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .header-title { font-size: 11.5px; font-weight: 700; fill: #cbd5e1; letter-spacing: 1.8px; }
    .view-all { font-size: 12px; font-weight: 500; fill: #38bdf8; }
  </style>

  <rect width="920" height="36" fill="#030712" />

  <!-- Cube Icon & Title -->
  <g transform="translate(16, 20)">
    <!-- 3D Isometric Cube Icon -->
    <g transform="translate(0, -12)">
      <polygon points="8,1 15,5 8,9 1,5" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linejoin="round" />
      <polygon points="1,5 8,9 8,17 1,13" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linejoin="round" />
      <polygon points="15,5 8,9 8,17 15,13" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linejoin="round" />
    </g>
    <text x="24" y="0" class="font-mono header-title">SELECTED WORK</text>
  </g>

  <!-- View all repositories link -->
  <g transform="translate(768, 20)">
    <text x="0" y="0" class="font-sans view-all">View all repositories →</text>
  </g>
</svg>
