<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 64" width="100%" height="100%">
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .section-title { font-size: 11.5px; font-weight: 700; fill: #cbd5e1; letter-spacing: 1.6px; }
    .pill-default { fill: #0b1424; stroke: #1a2b44; stroke-width: 1; rx: 12; }
    .pill-active { fill: #08213e; stroke: #0284c7; stroke-width: 1.2; rx: 12; }
    .pill-text { font-size: 10.5px; fill: #94a3b8; font-weight: 500; }
    .pill-text-active { font-size: 10.5px; fill: #38bdf8; font-weight: 600; }
    .side-slogan { font-size: 8px; font-weight: 600; fill: #5a6e8c; letter-spacing: 1.4px; }
  </style>

  <rect width="920" height="64" fill="#030712" />

  <!-- Stack Icon & Title -->
  <g transform="translate(16, 26)">
    <!-- Layers / Stack Icon -->
    <g transform="translate(0, -9)">
      <path d="M7 1 L14 4.5 L7 8 L0 4.5 Z" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linejoin="round" />
      <path d="M0 7.5 L7 11 L14 7.5" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linejoin="round" />
      <path d="M0 10.5 L7 14 L14 10.5" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linejoin="round" />
    </g>
    <text x="22" y="3" class="font-mono section-title">TECH STACK <tspan fill="#64748b" font-weight="400">(FROM REPOS)</tspan></text>
  </g>

  <!-- Tech Pills -->
  <g transform="translate(210, 18)">
    <!-- Python (Active) -->
    <g transform="translate(0, 0)">
      <rect width="66" height="24" class="pill-active" />
      <circle cx="12" cy="12" r="3" fill="#38bdf8" />
      <text x="36" y="15.5" text-anchor="middle" class="font-sans pill-text-active">Python</text>
    </g>

    <!-- Computer Vision -->
    <g transform="translate(72, 0)">
      <rect width="98" height="24" class="pill-default" />
      <text x="49" y="15.5" text-anchor="middle" class="font-sans pill-text">Computer Vision</text>
    </g>

    <!-- Machine Learning -->
    <g transform="translate(176, 0)">
      <rect width="102" height="24" class="pill-default" />
      <text x="51" y="15.5" text-anchor="middle" class="font-sans pill-text">Machine Learning</text>
    </g>

    <!-- AI Agents -->
    <g transform="translate(284, 0)">
      <rect width="68" height="24" class="pill-default" />
      <text x="34" y="15.5" text-anchor="middle" class="font-sans pill-text">AI Agents</text>
    </g>

    <!-- GraphQL -->
    <g transform="translate(358, 0)">
      <rect width="62" height="24" class="pill-default" />
      <text x="31" y="15.5" text-anchor="middle" class="font-sans pill-text">GraphQL</text>
    </g>

    <!-- Blockchain -->
    <g transform="translate(426, 0)">
      <rect width="72" height="24" class="pill-default" />
      <text x="36" y="15.5" text-anchor="middle" class="font-sans pill-text">Blockchain</text>
    </g>

    <!-- Android -->
    <g transform="translate(504, 0)">
      <rect width="60" height="24" class="pill-default" />
      <text x="30" y="15.5" text-anchor="middle" class="font-sans pill-text">Android</text>
    </g>
  </g>

  <!-- Right Accent Slogan -->
  <g transform="translate(800, 21)">
    <line x1="0" y1="2" x2="0" y2="22" stroke="#0ea5e9" stroke-width="1.8" stroke-linecap="round" />
    <g transform="translate(10, 7)">
      <text x="0" y="0" class="font-mono side-slogan">SAME TOOLS.</text>
      <text x="0" y="11" class="font-mono side-slogan">BIGGER POSSIBILITIES.</text>
    </g>
  </g>
</svg>
